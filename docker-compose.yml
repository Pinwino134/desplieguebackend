x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-common-env: &common-env
  DB_HOST: postgres
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-1234}
  JWT_SECRET: ${JWT_SECRET:-c2FtcGxlLXNlY3JldC1jYW1iaWFyLWVuLXByb2R1Y2Npb24tZWNjb21lcmNlLXBpbndpbm8tMjAyNg==}
  JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+UseSerialGC"

services:

  # --------------------------------------------------------------
  # PostgreSQL 16 sirviendo las 7 bases de datos aisladas
  # --------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - eccomerce-net

  # --------------------------------------------------------------
  # Config Server (perfil native)
  # --------------------------------------------------------------
  configserver:
    build:
      context: .
      dockerfile: configserver/Dockerfile
    container_name: configserver
    restart: unless-stopped
    logging: *default-logging
    environment: *common-env
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - eccomerce-net

  # --------------------------------------------------------------
  # Eureka Server (solo accesible en red interna o localhost)
  # --------------------------------------------------------------
  discoveryserver:
    build:
      context: .
      dockerfile: discoveryserver/Dockerfile
    container_name: discoveryserver
    restart: unless-stopped
    logging: *default-logging
    environment: *common-env
    depends_on:
      configserver:
        condition: service_healthy
    ports:
      - "127.0.0.1:8761:8761"
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - eccomerce-net

  # --------------------------------------------------------------
  # API Gateway: único servicio expuesto al exterior (puerto 8080)
  # --------------------------------------------------------------
  apigateway:
    build:
      context: .
      dockerfile: apigateway/Dockerfile
    container_name: apigateway
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *common-env
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_AUTH_RPM: ${RATE_LIMIT_AUTH_RPM:-25}
      RATE_LIMIT_API_RPM: ${RATE_LIMIT_API_RPM:-200}
    ports:
      - "8080:8080"
    depends_on:
      configserver:
        condition: service_healthy
      discoveryserver:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - eccomerce-net

  # --------------------------------------------------------------
  # Microservicios de negocio (7 servicios)
  # --------------------------------------------------------------
  authservice:
    build:
      context: .
      dockerfile: microservices/authservice/Dockerfile
    container_name: authservice
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *common-env
      # Primer administrador opcional (solo se crea si aún no existe ninguno)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      configserver:
        condition: service_healthy
      discoveryserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - eccomerce-net

  productosservice:
    build:
      context: .
      dockerfile: microservices/productosservice/Dockerfile
    container_name: productosservice
    restart: unless-stopped
    logging: *default-logging
    environment: *common-env
    depends_on:
      configserver:
        condition: service_healthy
      discoveryserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - eccomerce-net

  ventasservice:
    build:
      context: .
      dockerfile: microservices/ventasservice/Dockerfile
    container_name: ventasservice
    restart: unless-stopped
    logging: *default-logging
    environment: *common-env
    depends_on:
      configserver:
        condition: service_healthy
      discoveryserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - eccomerce-net

  pagosservice:
    build:
      context: .
      dockerfile: microservices/pagosservice/Dockerfile
    container_name: pagosservice
    restart: unless-stopped
    logging: *default-logging
    environment: *common-env
    depends_on:
      configserver:
        condition: service_healthy
      discoveryserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - eccomerce-net

  logisticaservice:
    build:
      context: .
      dockerfile: microservices/logisticaservice/Dockerfile
    container_name: logisticaservice
    restart: unless-stopped
    logging: *default-logging
    environment: *common-env
    depends_on:
      configserver:
        condition: service_healthy
      discoveryserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - eccomerce-net

  gerenciaservice:
    build:
      context: .
      dockerfile: microservices/gerenciaservice/Dockerfile
    container_name: gerenciaservice
    restart: unless-stopped
    logging: *default-logging
    environment: *common-env
    depends_on:
      configserver:
        condition: service_healthy
      discoveryserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - eccomerce-net

  serviciosservice:
    build:
      context: .
      dockerfile: microservices/serviciosservice/Dockerfile
    container_name: serviciosservice
    restart: unless-stopped
    logging: *default-logging
    environment: *common-env
    depends_on:
      configserver:
        condition: service_healthy
      discoveryserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - eccomerce-net

  # --------------------------------------------------------------
  # Observabilidad y Gestión de Capacidad (perfil opcional)
  # Levantar con: docker compose --profile monitoring up -d
  #   Grafana:    http://localhost:3000
  #   Prometheus: http://localhost:9090
  # --------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - eccomerce-net

  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-${GRAFANA_ADMIN_PASSWORD:-admin123}}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - eccomerce-net

  # --------------------------------------------------------------
  # PRUEBAS DE CARGA con JMeter (no arranca con "up", solo bajo demanda):
  #   docker compose --profile loadtest run --rm jmeter
  # Resultados en ./jmeter/resultados/reporte/index.html
  # --------------------------------------------------------------
  jmeter:
    build: ./jmeter
    profiles: ["loadtest"]
    environment:
      JVM_ARGS: "-Xms512m -Xmx1g"
    volumes:
      - ./jmeter:/test
    networks:
      - eccomerce-net
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        rm -rf /test/resultados && mkdir -p /test/resultados &&
        jmeter -n -t /test/arteandino.jmx
        -l /test/resultados/resultados.jtl
        -e -o /test/resultados/reporte
        -Jhost=apigateway -Jport=8080
        -Jusuarios=${LOAD_USERS:-50}
        -Jrampa=${LOAD_RAMP:-30}
        -Jduracion=${LOAD_DURATION:-120}
        -Jemail=${LOAD_EMAIL:-}
        -Jpassword=${LOAD_PASSWORD:-}

networks:
  eccomerce-net:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

# CI/CD Backend — Integración Continua, Control de Cambios y Despliegue (Avance 03)
#
# Etapas:
#   1. pruebas-y-compilacion -> Ejecuta pruebas unitarias/seguridad (SIN -DskipTests) y empaqueta JARs
#   2. imagenes              -> Construye las 10 imágenes Docker endurecidas (incluye serviciosservice)
#   3. validar-compose       -> Verifica sintaxis de docker-compose.yml y configuración de Prometheus
#   4. deploy                -> Solo en push a main: despliega en Oracle Cloud y ejecuta smoke tests
#                               (healthchecks + rutas públicas + verificación 401 en rutas protegidas)

name: CI/CD Backend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # 1) Pruebas automatizadas RF/Seguridad y Compilación (Maven)
  # ------------------------------------------------------------------
  compilar:
    name: Pruebas y Compilación (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # configserver, discoveryserver y los 7 microservicios (ejecutando pruebas reales)
      - name: Ejecutar tests y empaquetar reactor
        run: mvn -B -ntp test package -Dmaven.test.skip=false

      # API Gateway (pruebas de JWT, RBAC, Rate Limit y cabeceras OWASP)
      - name: Ejecutar tests y empaquetar API Gateway
        run: mvn -B -ntp -f apigateway/pom.xml test package -Dmaven.test.skip=false

      - name: Publicar reportes Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-backend
          path: "**/target/surefire-reports/*.xml"
          retention-days: 7

      - name: Subir jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            **/target/*.jar
            !**/target/*.jar.original
          retention-days: 3

  # ------------------------------------------------------------------
  # 2) Construir las 10 imágenes Docker en paralelo
  # ------------------------------------------------------------------
  imagenes:
    name: Imagen ${{ matrix.servicio }}
    needs: compilar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { servicio: configserver,     dockerfile: configserver/Dockerfile }
          - { servicio: discoveryserver,  dockerfile: discoveryserver/Dockerfile }
          - { servicio: apigateway,       dockerfile: apigateway/Dockerfile }
          - { servicio: authservice,      dockerfile: microservices/authservice/Dockerfile }
          - { servicio: productosservice, dockerfile: microservices/productosservice/Dockerfile }
          - { servicio: ventasservice,    dockerfile: microservices/ventasservice/Dockerfile }
          - { servicio: pagosservice,     dockerfile: microservices/pagosservice/Dockerfile }
          - { servicio: logisticaservice, dockerfile: microservices/logisticaservice/Dockerfile }
          - { servicio: gerenciaservice,  dockerfile: microservices/gerenciaservice/Dockerfile }
          - { servicio: serviciosservice, dockerfile: microservices/serviciosservice/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: arteandino/${{ matrix.servicio }}:ci
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

  # ------------------------------------------------------------------
  # 3) Validación de infraestructura y control de cambios
  # ------------------------------------------------------------------
  validar-compose:
    name: Validar docker-compose y observabilidad
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose --profile monitoring config -q

  # ------------------------------------------------------------------
  # 4) Despliegue en Oracle Cloud + Smoke Tests (solo push a main)
  # ------------------------------------------------------------------
  deploy:
    name: Desplegar en Oracle Cloud
    needs: [compilar, imagenes, validar-compose]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-produccion
      cancel-in-progress: false
    env:
      HOST: ${{ secrets.ORACLE_HOST }}
      USUARIO: ${{ secrets.ORACLE_USER }}
      CARPETA: ${{ vars.ORACLE_APP_DIR || '~/desplieguebackend' }}
    steps:
      - name: Preparar conexión SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Actualizar código y levantar servicios
        run: |
          ssh -i ~/.ssh/deploy_key "$USUARIO@$HOST" bash -s <<EOF
          set -euo pipefail
          cd $CARPETA
          git fetch origin main
          git reset --hard origin/main
          docker compose up --build -d --remove-orphans
          docker image prune -f
          docker compose ps
          EOF

      - name: Pruebas de humo (disponibilidad + seguridad)
        run: |
          for i in $(seq 1 30); do
            codigo_pub=$(curl -s -o /dev/null -w '%{http_code}' "http://$HOST:8080/api/v1/categorias" || true)
            codigo_health=$(curl -s -o /dev/null -w '%{http_code}' "http://$HOST:8080/actuator/health" || true)
            codigo_priv=$(curl -s -o /dev/null -w '%{http_code}' "http://$HOST:8080/api/v1/solicitudes" || true)
            echo "Intento $i: /categorias=$codigo_pub | /actuator/health=$codigo_health | /solicitudes(sin token)=$codigo_priv"
            if [ "$codigo_pub" = "200" ] && [ "$codigo_health" = "200" ] && [ "$codigo_priv" = "401" ]; then
              echo "### Deploy OK :rocket:" >> "$GITHUB_STEP_SUMMARY"
              echo "- Gateway activo en http://$HOST:8080" >> "$GITHUB_STEP_SUMMARY"
              echo "- Healthcheck Actuator: HTTP 200" >> "$GITHUB_STEP_SUMMARY"
              echo "- Verificación RBAC/JWT sin token: HTTP 401" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "### Deploy con problemas :x:" >> "$GITHUB_STEP_SUMMARY"
          echo "El gateway no superó las pruebas de humo en 5 minutos." >> "$GITHUB_STEP_SUMMARY"
          exit 1

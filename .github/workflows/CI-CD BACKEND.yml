# Ubicación: desplieguebackend/.github/workflows/ci-cd.yml
#
# CI/CD del backend de microservicios:
#   1. compilar  -> Maven (reactor + api gateway), sube los .jar como artefacto
#   2. imagenes  -> construye las 9 imágenes Docker en paralelo (matriz) con caché
#   3. deploy    -> solo en main: entra por SSH a la VM de Oracle, actualiza y
#                   levanta con docker compose; luego prueba que el gateway responda
#
# Secrets necesarios (Settings > Secrets and variables > Actions):
#   ORACLE_HOST      IP o dominio de la VM
#   ORACLE_USER      usuario SSH (ej. ubuntu u opc)
#   ORACLE_SSH_KEY   clave privada SSH completa (la que NO tiene passphrase)
# Variable opcional:
#   ORACLE_APP_DIR   carpeta del proyecto en la VM (por defecto ~/desplieguebackend)

name: CI/CD Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Si llega un push nuevo, se cancela la corrida anterior de la misma rama.
# (El job de deploy tiene su propia regla para NO cancelarse a mitad.)
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # 1) Compilar con Maven
  # ------------------------------------------------------------------
  compilar:
    name: Compilar (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # configserver, discoveryserver y los 6 microservicios
      - name: Compilar reactor
        run: mvn -B -ntp package -DskipTests

      # El gateway NO está en el reactor (tiene su propio pom)
      - name: Compilar api gateway
        run: mvn -B -ntp -f apigateway/pom.xml package -DskipTests

      - name: Subir jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            **/target/*.jar
            !**/target/*.jar.original
          retention-days: 3

  # ------------------------------------------------------------------
  # 2) Construir las imágenes Docker (una por servicio, en paralelo)
  # ------------------------------------------------------------------
  imagenes:
    name: Imagen ${{ matrix.servicio }}
    needs: compilar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { servicio: configserver,     dockerfile: configserver/Dockerfile }
          - { servicio: discoveryserver,  dockerfile: discoveryserver/Dockerfile }
          - { servicio: apigateway,       dockerfile: apigateway/Dockerfile }
          - { servicio: authservice,      dockerfile: microservices/authservice/Dockerfile }
          - { servicio: productosservice, dockerfile: microservices/productosservice/Dockerfile }
          - { servicio: ventasservice,    dockerfile: microservices/ventasservice/Dockerfile }
          - { servicio: pagosservice,     dockerfile: microservices/pagosservice/Dockerfile }
          - { servicio: logisticaservice, dockerfile: microservices/logisticaservice/Dockerfile }
          - { servicio: gerenciaservice,  dockerfile: microservices/gerenciaservice/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # El contexto es la RAÍZ del repo (igual que en el docker-compose.yml)
      - name: Construir imagen (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: arteandino/${{ matrix.servicio }}:ci
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

  # ------------------------------------------------------------------
  # Valida que el docker-compose.yml sea correcto
  # ------------------------------------------------------------------
  validar-compose:
    name: Validar docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q

  # ------------------------------------------------------------------
  # 3) Desplegar en Oracle Cloud (solo push a main o ejecución manual en main)
  # ------------------------------------------------------------------
  deploy:
    name: Desplegar en Oracle Cloud
    needs: [compilar, imagenes, validar-compose]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-produccion
      cancel-in-progress: false
    env:
      HOST: ${{ secrets.ORACLE_HOST }}
      USUARIO: ${{ secrets.ORACLE_USER }}
      CARPETA: ${{ vars.ORACLE_APP_DIR || '~/desplieguebackend' }}
    steps:
      - name: Preparar conexión SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Actualizar código y levantar servicios
        run: |
          ssh -i ~/.ssh/deploy_key "$USUARIO@$HOST" bash -s <<EOF
          set -euo pipefail
          cd $CARPETA
          git fetch origin main
          git reset --hard origin/main
          docker compose up --build -d --remove-orphans
          docker image prune -f
          docker compose ps
          EOF

      # Espera hasta 5 minutos a que el gateway responda (ruta pública)
      - name: Prueba de humo
        run: |
          for i in $(seq 1 30); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' "http://$HOST:8080/api/v1/categorias" || true)
            echo "Intento $i: HTTP $codigo"
            if [ "$codigo" = "200" ]; then
              echo "### Deploy OK :rocket:" >> "$GITHUB_STEP_SUMMARY"
              echo "Gateway respondiendo en http://$HOST:8080" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "### Deploy con problemas :x:" >> "$GITHUB_STEP_SUMMARY"
          echo "El gateway no respondió HTTP 200 en 5 minutos." >> "$GITHUB_STEP_SUMMARY"
          exit 1

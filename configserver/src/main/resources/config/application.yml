# Este archivo se llama igual que el "default application name" de Spring
# Cloud Config Server, así que TODOS los clientes (apigateway + los 7
# microservicios) lo reciben automáticamente.
eureka:
  client:
    service-url:
      defaultZone: http://discoveryserver:8761/eureka/
  instance:
    prefer-ip-address: true

# Observabilidad y métricas de capacidad (Actuator + Micrometer + Prometheus)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # histogramas de latencia -> permiten calcular percentiles (p95, p99)
      percentiles-histogram:
        http.server.requests: true

# Afinamiento común de pool de conexiones HikariCP (7 microservicios comparten Postgres)
spring:
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 8000
